name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build
        env:
          VITE_WS_URL: wss://play.quizlive.ru/ws

      - name: Setup SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' '${{ secrets.VPS_SSH_KEY }}' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H '${{ secrets.VPS_HOST }}' >> ~/.ssh/known_hosts

      - name: Deploy static files
        run: |
          rsync -az --delete --chmod=D755,F644 -e "ssh -i ~/.ssh/deploy_key" dist/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/quizelive/play/

      - name: Smoke check
        run: curl -fsS -o /dev/null https://play.quizlive.ru/
